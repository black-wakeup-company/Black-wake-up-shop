name: Validate multiboutique-dev

on:
  push:
    branches:
      - multiboutique-dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-multiboutique-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Firestore rules emulator tests
        run: npm run test:rules

      - name: Production build
        run: npm run build
